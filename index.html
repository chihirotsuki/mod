<!DOCTYPE html>
<html lang="zh-tw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⛏️ 模組連結</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1e1e1e; 
      background-image: 
        linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
        linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
        linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
      background-size: 40px 40px;
      background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background-color: #3b3b3b; 
      border: 6px solid #5a5a5a;
      border-top-color: #7a7a7a;
      border-left-color: #7a7a7a;
      border-bottom-color: #2a2a2a;
      border-right-color: #2a2a2a;
      box-shadow: 
        0 0 0 4px #1e1e1e,
        0 0 0 8px #4a4a4a,
        inset 0 0 0 2px #2e2e2e;
      padding: 30px 20px;
      position: relative;
      image-rendering: pixelated;
    }

    /* 標題區域 */
    .title-section {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 4px solid #6b6b6b;
      padding-bottom: 20px;
      position: relative;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 2.2rem;
      color: #f0f0f0;
      text-shadow: 
        4px 4px 0 #3f3f3f,
        6px 6px 0 #1a1a1a;
      letter-spacing: 4px;
      margin-bottom: 10px;
      word-break: break-word;
      line-height: 1.4;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #b0b0b0;
      text-shadow: 2px 2px 0 #1a1a1a;
      letter-spacing: 2px;
      background: #2b2b2b;
      display: inline-block;
      padding: 8px 16px;
      border: 3px solid #5e5e5e;
      border-radius: 0; /* 方形，像素感 */
      box-shadow: inset -2px -2px 0 #1a1a1a, inset 2px 2px 0 #6e6e6e;
    }

    /* 模組列表容器 */
    .mod-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
    }

    /* 單個模組卡片的樣式 */
    .mod-card {
      display: flex;
      align-items: center;
      background-color: #4f4f4f;
      border: 5px solid #6a6a6a;
      border-top-color: #8a8a8a;
      border-left-color: #8a8a8a;
      border-bottom-color: #2f2f2f;
      border-right-color: #2f2f2f;
      box-shadow: 0 0 0 3px #1e1e1e, 0 0 0 5px #3a3a3a;
      padding: 12px 18px;
      transition: all 0.1s ease;
      text-decoration: none;
      color: #f0f0f0;
      cursor: pointer;
      /* 像素感字體 */
      font-family: 'Press Start 2P', monospace;
      image-rendering: pixelated;
      position: relative;
    }

    /* 懸停效果：發光 & 稍微浮起 */
    .mod-card:hover {
      background-color: #5f5f5f;
      border-top-color: #b0b0b0;
      border-left-color: #b0b0b0;
      border-bottom-color: #3a3a3a;
      border-right-color: #3a3a3a;
      box-shadow: 
        0 0 0 3px #1e1e1e,
        0 0 0 5px #4a4a4a,
        0 0 20px #8b8b8b,
        inset 0 0 10px #8a8a8a;
      transform: translateY(-2px);
    }

    /* 點擊效果 */
    .mod-card:active {
      transform: translateY(2px);
      box-shadow: 
        0 0 0 3px #1e1e1e,
        0 0 0 5px #2a2a2a,
        inset 0 0 10px #2a2a2a;
    }

    /* 模組圖標（用文字或emoji模擬） */
    .mod-icon {
      font-size: 2.2rem;
      margin-right: 18px;
      text-shadow: 3px 3px 0 #1a1a1a;
      filter: drop-shadow(0 0 4px #8b8b8b);
      min-width: 60px;
      text-align: center;
    }

    /* 模組資訊區 */
    .mod-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mod-name {
      font-size: 1.1rem;
      color: #ffd966;
      text-shadow: 2px 2px 0 #3f3f3f;
      letter-spacing: 1px;
      line-height: 1.4;
      word-break: break-word;
    }

    .mod-desc {
      font-size: 0.65rem;
      color: #c0c0c0;
      text-shadow: 1px 1px 0 #1a1a1a;
      line-height: 1.5;
      letter-spacing: 0.5px;
    }

    /* 右側箭頭或標示 */
    .mod-arrow {
      font-size: 1.8rem;
      color: #b0b0b0;
      text-shadow: 2px 2px 0 #1a1a1a;
      margin-left: 10px;
      transition: transform 0.2s;
    }

    .mod-card:hover .mod-arrow {
      color: #ffd966;
      transform: translateX(6px);
    }

    /* 頁腳：簡單的裝飾 */
    .footer {
      margin-top: 35px;
      text-align: center;
      font-size: 0.6rem;
      color: #8a8a8a;
      text-shadow: 1px 1px 0 #1a1a1a;
      border-top: 3px solid #5a5a5a;
      padding-top: 20px;
      letter-spacing: 1px;
    }

    /* 裝飾用的小方塊 */
    .deco-block {
      position: absolute;
      width: 12px;
      height: 12px;
      background-color: #6b6b6b;
      border: 2px solid #3f3f3f;
      opacity: 0.7;
    }

    .deco-1 { top: 15px; left: 15px; }
    .deco-2 { bottom: 15px; right: 15px; background-color: #8b8b8b; border-color: #4f4f4f; }
    .deco-3 { top: 30px; right: 30px; width: 8px; height: 8px; background-color: #a0a0a0; border-width: 1px; }

    /* 響應式調整 */
    @media (max-width: 600px) {
      h1 {
        font-size: 1.4rem;
        letter-spacing: 2px;
      }
      .mod-icon {
        font-size: 1.8rem;
        margin-right: 12px;
        min-width: 40px;
      }
      .mod-name {
        font-size: 0.85rem;
      }
      .mod-desc {
        font-size: 0.55rem;
      }
      .mod-arrow {
        font-size: 1.3rem;
      }
      .container {
        padding: 20px 12px;
      }
    }

    @media (max-width: 400px) {
      .mod-card {
        padding: 10px 12px;
      }
      .mod-icon {
        font-size: 1.5rem;
        min-width: 32px;
      }
      .mod-name {
        font-size: 0.75rem;
      }
    }

    a {
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 裝飾小方塊 -->
    <div class="deco-block deco-1"></div>
    <div class="deco-block deco-2"></div>
    <div class="deco-block deco-3"></div>

    <!-- 標題區 -->
    <div class="title-section">
      <h1>⛏️ 模組連結</h1>
      <div class="subtitle">MINECRAFT MODS</div>
    </div>

    <div class="mod-list">


      <a href="https://www.curseforge.com/minecraft/mc-mods/tap-deposit" class="mod-card" target="_blank" rel="noopener">
        <div class="mod-icon">📦</div>
        <div class="mod-info">
          <div class="mod-name">Tap Deposit</div>
          <div class="mod-desc">類似hypixel BedWars Quick Deposit</div>
        </div>
        <div class="mod-arrow">➤</div>
      </a>
      

    </div>

    <!-- 頁腳 -->
    <div class="footer">
      <span style="opacity:0.7;">MINECRAFT MOD LINKS</span>
    </div>
  </div>

</body>
</html>
